{% extends "nurse/nurse_dashboard.html" %}
{% block content %}
<div class="container my-4">
    <h3 class="text-center mb-4">Edit Vitals for {{ vitals.resident.name }}</h3>

    <div class="card shadow p-4" style="max-width: 700px; margin:auto;">
        <form method="POST">
            {% csrf_token %}
            <div class="mb-2">
                <label>Patient:</label>
                <input type="text" class="form-control" value="{{ vitals.resident.name }}" disabled>
            </div>

            <br>

            <div class="mb-2">
                <label>Doctor:</label>
                <select name="doctor" class="form-control" required>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if doctor.id == vitals.doctor.id %}selected{% endif %}>
                        {{ doctor.name }} ({{ doctor.specialization }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <br>
            <div class="mb-2">
                <label>Blood Pressure:</label>
                <input type="text" name="blood_pressure" class="form-control" value="{{ vitals.blood_pressure }}" required>
            </div>
            <br>
            <div class="mb-2">
                <label>Blood Sugar (mg/dL):</label>
                <input type="number" step="0.1" name="blood_sugar" class="form-control" value="{{ vitals.blood_sugar }}" required>
            </div>
            <br>
            <div class="mb-2">
                <label>Heart Rate (bpm):</label>
                <input type="number" name="heart_rate" class="form-control" value="{{ vitals.heart_rate }}" required>
            </div>
            <br>
            <div class="mb-2">
                <label>Body Temperature (°C):</label>
                <input type="number" step="0.1" name="body_temperature" class="form-control" value="{{ vitals.body_temperature }}" required>
          </div>
          <br>
            <div class="text-center mt-3">
                <button type="submit" class="btn btn-primary px-5">Update Vitals</button>
                <a href="{% url 'manage_vitals' %}" class="btn btn-secondary px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
