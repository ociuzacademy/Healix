{% extends 'admin/admin_dashboard.html' %}

{% block content %}
<div class="container my-4">
    <div class="mb-3">
    <button onclick="window.history.back()" class="btn btn-primary"> Back</button>
</div>

    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <h3 class="text-center mb-4">Add Resident</h3>
       
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label>Name:</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Age:</label>
                <input type="number" name="age" class="form-control" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Gender:</label>
                <select name="gender" class="form-control" required>
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <br>
            <div class="mb-3">
                <label>Room Number:</label>
                <input type="text" name="room_number" class="form-control" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Relative Contact Name:</label>
                <input type="text" name="emergency_contact_name" class="form-control" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Relative Phone:</label>
                <input type="text" name="emergency_phone" class="form-control" maxlength="12" minlength="10" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Relative Address:</label>
                <input type="text" name="emergency_address" class="form-control" required>
            </div>
            <br>
            <div class="mb-3">
                <label>Relative Place:</label>
                <input type="text" name="emergency_place" class="form-control" required>
            </div>
            <br>
            <div class="text-center">
                <button type="submit" class="btn btn-success px-5">Add Resident</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
